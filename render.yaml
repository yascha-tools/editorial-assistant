services:
  - type: web
    name: editorial-assistant
    env: node
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: APP_PASSWORD
        sync: false
      - key: SESSION_SECRET
        sync: false
      - key: ADMIN_PASSWORD   # unlocks /admin (rule approvals, model upgrades)
        sync: false
      - key: SMTP_URL         # optional: email alerts, e.g. smtps://user%40gmail.com:APP_PASSWORD@smtp.gmail.com:465
        sync: false
      - key: ADMIN_EMAIL      # optional: where alerts go
        sync: false
      - key: TURSO_DATABASE_URL
        sync: false
      - key: TURSO_AUTH_TOKEN
        sync: false
